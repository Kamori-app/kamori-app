[workspace]
members = [
  "packages/crypto-core-lib",
  "apps/cloud-server",
  "apps/dav-bridge-desktop/src-tauri",
]
exclude = [
  "apps/dav-bridge-desktop",
  "apps/dav-bridge-mobile",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

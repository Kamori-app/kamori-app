name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kamori
          POSTGRES_PASSWORD: kamori-ci
          POSTGRES_DB: kamori_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamori -d kamori_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kamori:kamori-ci@localhost:5432/kamori_ci
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install desktop system dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The Azure-local Ubuntu mirror has repeatedly stalled while serving
          # WebKit packages. New runner images resolve their mirror through an
          # apt mirror-list file, so replace both forms with Ubuntu's GeoDNS
          # endpoint instead of only rewriting a direct Azure URL.
          sudo sed -i \
            -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile every target
        run: cargo check --workspace --all-targets
      - name: Strict lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Flutter bridge feature tests
        run: cargo test -p crypto-core-lib --features frb

  frontend:
    name: Web and desktop frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Turbo task cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-frontend-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-frontend-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test frontends
        run: >-
          bunx turbo run test
          --filter=web-frontend
          --filter=admin-frontend
          --filter=dav-bridge-desktop
      - name: Build frontends
        run: >-
          bunx turbo run build
          --filter=web-frontend
          --filter=admin-frontend
          --filter=dav-bridge-desktop

  mobile-checks:
    name: Mobile static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dav-bridge-mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        run: flutter test

  android:
    name: Android native package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dav-bridge-mobile
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Build release APK with Rust core
        run: flutter build apk --release --dart-define=KAMORI_USE_MOCK_RUST=false
      - name: Verify native Rust libraries are packaged
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/arm64-v8a/libcrypto_core_lib.so'

  ios:
    name: iOS native package
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/dav-bridge-mobile
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Build unsigned iOS release with Rust core
        run: flutter build ios --release --no-codesign

  server-image:
    name: Production containers and acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: false
          load: true
          tags: kamori/cloud-server:acceptance
          cache-from: type=gha,scope=cloud-server
          cache-to: type=gha,mode=max,scope=cloud-server
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web-frontend/Dockerfile
          push: false
          tags: kamori/web:ci
          cache-from: type=gha,scope=web-frontend
          cache-to: type=gha,mode=max,scope=web-frontend
      - name: Build acceptance web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web-frontend/Dockerfile
          push: false
          load: true
          tags: kamori/web:acceptance
          build-args: |
            VITE_KAMORI_API_BASE_URL=http://127.0.0.1:18080
            VITE_KAMORI_WEB_CSRF_COOKIE_NAME=kamori_csrf
          cache-from: type=gha,scope=web-frontend
      - name: Build operator console image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/admin-frontend/Dockerfile
          push: false
          tags: kamori/admin:ci
          cache-from: type=gha,scope=admin-frontend
          cache-to: type=gha,mode=max,scope=admin-frontend
      - name: Build acceptance operator console image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/admin-frontend/Dockerfile
          push: false
          load: true
          tags: kamori/admin:acceptance
          build-args: |
            VITE_KAMORI_API_BASE_URL=http://127.0.0.1:18080
          cache-from: type=gha,scope=admin-frontend
      - name: Build edge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/edge/Dockerfile
          push: false
          tags: kamori/edge:ci
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun package cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - name: Install acceptance dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Pull pinned acceptance service images
        run: docker compose --project-directory tests/acceptance -f tests/acceptance/compose.yaml pull postgres valkey minio minio-init
      - name: Run pull request acceptance smoke
        id: acceptance_smoke
        if: github.event_name == 'pull_request'
        env:
          KAMORI_ACCEPTANCE_SKIP_BUILD: "true"
          KAMORI_CONTAINER_ENGINE: docker
        run: bun run acceptance:smoke
      - name: Run full acceptance suite
        id: acceptance_full
        if: github.event_name != 'pull_request'
        env:
          KAMORI_ACCEPTANCE_SKIP_BUILD: "true"
          KAMORI_CONTAINER_ENGINE: docker
        run: bun run acceptance:full
      - name: Capture acceptance container logs
        if: >-
          failure() &&
          (steps.acceptance_smoke.outcome == 'failure' ||
          steps.acceptance_full.outcome == 'failure')
        env:
          KAMORI_CONTAINER_ENGINE: docker
        run: |
          mkdir -p tests/acceptance/artifacts
          bash scripts/acceptance.sh logs > tests/acceptance/artifacts/container-logs.txt 2>&1
      - name: Upload acceptance failure artifacts
        if: >-
          failure() &&
          (steps.acceptance_smoke.outcome == 'failure' ||
          steps.acceptance_full.outcome == 'failure')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: acceptance-failure-${{ github.run_id }}
          path: tests/acceptance/artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop acceptance stack
        if: >-
          always() &&
          (steps.acceptance_smoke.outcome != 'skipped' ||
          steps.acceptance_full.outcome != 'skipped')
        env:
          KAMORI_CONTAINER_ENGINE: docker
        run: bun run acceptance:down

  infrastructure:
    name: Pulumi Go stack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Validate deployment scripts
        run: |
          find ../deploy -type f -perm -u=x -exec bash -n {} +
          if ../deploy/cloud-server/deploy-cloud-server bad bad bad bad; then
            echo "deployment script accepted mutable image references" >&2
            exit 1
          fi
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        run: go vet ./...
      - name: Tests
        run: go test ./...

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kamori
          POSTGRES_PASSWORD: kamori-ci
          POSTGRES_DB: kamori_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamori -d kamori_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kamori:kamori-ci@localhost:5432/kamori_ci
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile every target
        run: cargo check --workspace --all-targets
      - name: Strict lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      - name: Flutter bridge feature tests
        run: cargo test -p crypto-core-lib --features frb

  frontend:
    name: Web and desktop frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Web checks and tests
        run: bun run --filter web-frontend test
      - name: Web production build
        run: bun run --filter web-frontend build
      - name: Operator console checks and build
        run: bun run --filter admin-frontend test && bun run --filter admin-frontend build
      - name: Desktop checks
        run: bun run --filter dav-bridge-desktop test
      - name: Desktop production frontend build
        run: bun run --filter dav-bridge-desktop build

  mobile-checks:
    name: Mobile static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dav-bridge-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        run: flutter test

  android:
    name: Android native package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dav-bridge-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Build release APK with Rust core
        run: flutter build apk --release --dart-define=KAMORI_USE_MOCK_RUST=false
      - name: Verify native Rust libraries are packaged
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -q 'lib/arm64-v8a/libcrypto_core_lib.so'

  ios:
    name: iOS native package
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/dav-bridge-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get
      - name: Build unsigned iOS release with Rust core
        run: flutter build ios --release --no-codesign

  server-image:
    name: Production containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build production images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: false
          tags: kamori/cloud-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-frontend/Dockerfile
          push: false
          tags: kamori/web:ci
      - name: Build operator console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-frontend/Dockerfile
          push: false
          tags: kamori/admin:ci
      - name: Build edge image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/edge/Dockerfile
          push: false
          tags: kamori/edge:ci

  infrastructure:
    name: Pulumi Go stack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Static analysis
        run: go vet ./...
      - name: Tests
        run: go test ./...

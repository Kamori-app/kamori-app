name: Hosted infrastructure

on:
  workflow_dispatch:
    inputs:
      command:
        description: Pulumi operation
        required: true
        default: preview
        type: choice
        options:
          - preview
          - up

concurrency:
  group: hosted-infrastructure-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pulumi:
    name: Pulumi ${{ inputs.command }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: ${{ inputs.command }}
          stack-name: ${{ vars.PULUMI_STACK }}
          work-dir: infra
          comment-on-pr: false
          refresh: true
          upsert: false
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

name: Hosted infrastructure

on:
  workflow_dispatch:
    inputs:
      command:
        description: Pulumi operation
        required: true
        default: preview
        type: choice
        options:
          - preview
          - up

concurrency:
  group: hosted-infrastructure-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pulumi:
    name: Pulumi ${{ inputs.command }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: infra/go.mod
          cache-dependency-path: infra/go.sum
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          command: ${{ inputs.command }}
          # 3.258.0 cannot write this stack's Backblaze B2 DIY backend: its
          # updated S3 upload stack is rejected while creating the update lock.
          # Keep this pin aligned with infra/Pulumi.yaml and SECRETS.md until a
          # newer CLI is proven by both preview and up against B2.
          pulumi-version: 3.257.0
          stack-name: production
          work-dir: infra
          cloud-url: s3://kamori-production-pulumi-state?endpoint=s3.eu-central-003.backblazeb2.com&region=eu-central-003&awssdk=v2&s3ForcePathStyle=true
          comment-on-pr: false
          refresh: true
          upsert: false
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_PULUMI_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_PULUMI_APPLICATION_KEY }}
          AWS_REGION: eu-central-003
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

name: Deploy cloud server

on:
  workflow_dispatch:

concurrency:
  group: cloud-server-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Build immutable image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      cloud-image: ${{ steps.reference.outputs.cloud-image }}
      web-image: ${{ steps.reference.outputs.web-image }}
      admin-image: ${{ steps.reference.outputs.admin-image }}
      edge-image: ${{ steps.reference.outputs.edge-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image_names
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "cloud=ghcr.io/$owner/kamori-cloud" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/kamori-web" >> "$GITHUB_OUTPUT"
          echo "admin=ghcr.io/$owner/kamori-admin" >> "$GITHUB_OUTPUT"
          echo "edge=ghcr.io/$owner/kamori-edge" >> "$GITHUB_OUTPUT"
      - id: cloud
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/cloud-server/Dockerfile
          push: true
          tags: ${{ steps.image_names.outputs.cloud }}:${{ github.sha }}
          cache-from: type=gha,scope=cloud-server
          cache-to: type=gha,mode=max,scope=cloud-server
      - id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web-frontend/Dockerfile
          push: true
          tags: ${{ steps.image_names.outputs.web }}:${{ github.sha }}
          cache-from: type=gha,scope=web-frontend
          cache-to: type=gha,mode=max,scope=web-frontend
      - id: admin
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/admin-frontend/Dockerfile
          push: true
          tags: ${{ steps.image_names.outputs.admin }}:${{ github.sha }}
          cache-from: type=gha,scope=admin-frontend
          cache-to: type=gha,mode=max,scope=admin-frontend
      - id: edge
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/edge/Dockerfile
          push: true
          tags: ${{ steps.image_names.outputs.edge }}:${{ github.sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
      - id: reference
        env:
          CLOUD_DIGEST: ${{ steps.cloud.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin.outputs.digest }}
          EDGE_DIGEST: ${{ steps.edge.outputs.digest }}
          CLOUD_REPOSITORY: ${{ steps.image_names.outputs.cloud }}
          WEB_REPOSITORY: ${{ steps.image_names.outputs.web }}
          ADMIN_REPOSITORY: ${{ steps.image_names.outputs.admin }}
          EDGE_REPOSITORY: ${{ steps.image_names.outputs.edge }}
        run: |
          echo "cloud-image=$CLOUD_REPOSITORY@$CLOUD_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web-image=$WEB_REPOSITORY@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "admin-image=$ADMIN_REPOSITORY@$ADMIN_DIGEST" >> "$GITHUB_OUTPUT"
          echo "edge-image=$EDGE_REPOSITORY@$EDGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Rolling beta deployment
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: "2022"
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate registry and deploy immutable release
        env:
          APP_ONE: ${{ vars.BETA_APP_ONE_HOST }}
          APP_TWO: ${{ vars.BETA_APP_TWO_HOST }}
          OPS_HOST: ${{ vars.BETA_OPS_HOST }}
          DEPLOY_KEY: ${{ secrets.BETA_DEPLOY_SSH_PRIVATE_KEY }}
          HOST_CA: ${{ vars.BETA_SSH_HOST_CA_PUBLIC_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          CLOUD_IMAGE: ${{ needs.image.outputs.cloud-image }}
          WEB_IMAGE: ${{ needs.image.outputs.web-image }}
          ADMIN_IMAGE: ${{ needs.image.outputs.admin-image }}
          EDGE_IMAGE: ${{ needs.image.outputs.edge-image }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/kamori-ssh"
          key_file="$RUNNER_TEMP/kamori-ssh/deploy-key"
          known_hosts_file="$RUNNER_TEMP/kamori-ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/kamori-ssh"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '@cert-authority kamori-beta-ops,kamori-beta-app-1,kamori-beta-app-2,[kamori-beta-ops]:2022,[kamori-beta-app-1]:2022,[kamori-beta-app-2]:2022 %s\n' "$HOST_CA" > "$known_hosts_file"
          chmod 0600 "$key_file" "$known_hosts_file"
          ssh_config="$RUNNER_TEMP/kamori-ssh/config"
          cat > "$ssh_config" <<EOF
          Host kamori-beta-ops
            HostName $OPS_HOST
            HostKeyAlias kamori-beta-ops
            User deploy
            Port $SSH_PORT
            IdentityFile $key_file
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts_file

          Host kamori-beta-app-1
            HostName $APP_ONE
            HostKeyAlias kamori-beta-app-1
            User deploy
            Port $SSH_PORT
            IdentityFile $key_file
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts_file
            ProxyJump kamori-beta-ops

          Host kamori-beta-app-2
            HostName $APP_TWO
            HostKeyAlias kamori-beta-app-2
            User deploy
            Port $SSH_PORT
            IdentityFile $key_file
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $known_hosts_file
            ProxyJump kamori-beta-ops
          EOF
          chmod 0600 "$ssh_config"

          for host in kamori-beta-app-1 kamori-beta-app-2; do
            printf '%s' "$REGISTRY_TOKEN" | ssh -F "$ssh_config" "$host" \
              "sudo /usr/local/sbin/kamori-registry-login '$REGISTRY_USER'"
          done

          ssh -F "$ssh_config" kamori-beta-app-1 \
            "sudo /usr/local/sbin/kamori-deploy-migrate '$CLOUD_IMAGE' '$WEB_IMAGE' '$ADMIN_IMAGE' '$EDGE_IMAGE'"
          ssh -F "$ssh_config" kamori-beta-app-2 \
            "sudo /usr/local/sbin/kamori-deploy '$CLOUD_IMAGE' '$WEB_IMAGE' '$ADMIN_IMAGE' '$EDGE_IMAGE'"

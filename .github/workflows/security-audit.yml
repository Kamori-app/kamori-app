name: Dependency security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - "**/package.json"
      - bun.lock
      - .github/workflows/security-audit.yml
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - "**/package.json"
      - bun.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Bun production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit --production

  rust:
    name: RustSec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

[package]
name = "cloud-server"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
rmp-serde = "1.3"
tracing = { workspace = true }
crypto-core-lib = { path = "../../packages/crypto-core-lib", default-features = false }

axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
serde_urlencoded = "0.7"

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "chrono", "time", "uuid", "json"] }
dotenvy = "0.15"
uuid = { version = "1.24", features = ["v4", "serde"] }
time = { version = "0.3", features = ["macros", "serde"] }

opaque-ke = { version = "4.0.1", features = ["serde", "argon2", "std"] }
argon2 = "0.5"
webauthn-rs = { version = "0.5", optional = true, features = ["danger-allow-state-serialisation", "conditional-ui"] }
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
rand = "0.10"
rand08 = { package = "rand", version = "0.8.7", features = ["getrandom"] }
dashmap = "6.2"
sha2 = "0.11"
sha2_opaque = { package = "sha2", version = "0.10.9" }
chacha20poly1305 = "0.11"
hex = "0.4"
url = "2.5.8"
jsonwebtoken = { version = "11.0", default-features = false, features = ["aws_lc_rs"] }
redis = { version = "1.6", features = ["tokio-comp"] }
async-trait = "0.1"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
futures-util = "0.3"
ed25519-dalek = "3.0.0"
ipnet = "2.11"

[features]
default = ["webauthn"]
webauthn = ["webauthn-rs"]

[dev-dependencies]
tower = "0.5"

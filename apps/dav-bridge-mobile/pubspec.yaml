name: dav_bridge_mobile
description: Offline-first encrypted Kamori client for Android and iOS
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  workmanager: ^0.10.9
  uuid: ^4.6.0
  # 11.x requires compile SDK 37; Android target SDK remains Flutter-managed.
  flutter_secure_storage: ^11.0.0
  flutter_contacts: ^2.3.1
  device_calendar_plus: ^0.8.0
  rrule: ^0.2.18
  timezone: ^0.11.1

  collection: any
  crypto: ^3.0.6
  flutter_rust_bridge: ^2.13.0
  crypto_core_lib:
    path: rust_builder
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

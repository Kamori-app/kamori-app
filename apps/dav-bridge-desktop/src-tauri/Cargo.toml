[package]
name = "dav-bridge-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
rmp-serde = "1.3"
tracing = { workspace = true }

crypto-core-lib = { path = "../../../packages/crypto-core-lib" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
keyring-core = "1.0.0"
open = { version = "5.4.1", features = ["shellexecute-on-windows"] }
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
url = "2.5.8"
opaque-ke = { version = "4.0.1", features = ["argon2", "std"] }
sha2 = "0.11"
sha2_opaque = { package = "sha2", version = "0.10.9" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ed25519-dalek = "3.0.0"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
crate-type = ["rlib"]

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kamori-cloud
    authorization:
      credentials_file: /run/secrets/kamori_metrics_token
    static_configs:
      - targets: ["10.42.0.11:8080", "10.42.0.12:8080"]

  - job_name: node
    static_configs:
      - targets:
          - 10.42.0.11:9100
          - 10.42.0.12:9100
          - 10.42.0.21:9100
          - 10.42.0.22:9100
          - 10.42.0.31:9100

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

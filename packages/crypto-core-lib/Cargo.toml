[package]
name = "crypto-core-lib"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["native", "http-reqwest", "local-bridge"]
native = []
sync-runtime = ["native", "http-reqwest", "dep:tokio", "dep:rusqlite"]
local-bridge = ["sync-runtime", "dep:axum", "dep:quick-xml"]
wasm = [
  "wasm-bindgen",
  "wasm-bindgen-futures",
  "getrandom/wasm_js",
  "serde-wasm-bindgen",
  "dep:opaque-ke",
  "dep:qrcode",
  "dep:getrandom02"
]
frb = ["flutter_rust_bridge", "native", "sync-runtime", "dep:opaque-ke"]
http-reqwest = ["reqwest", "native"]
flutter_rust_bridge = ["dep:flutter_rust_bridge"]

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
rmp-serde = "1.3"
tracing = { workspace = true }
bytes = "1"

# Crypto
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
aes-gcm = "0.11"

chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
sha2_opaque = { package = "sha2", version = "0.10.9" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"], optional = true }
zeroize = { version = "1.9", features = ["derive"] }
bip39 = { version = "2.2.2", default-features = false, features = ["alloc", "unicode-normalization"] }
once_cell = "1.21"
ed25519-dalek = "3.0.0"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "hkdfsha2", "chacha"] }

# WASM bindings
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Flutter Rust Bridge (v2)
flutter_rust_bridge = { version = "=2.12.0", optional = true }

# HTTP client for the signed operation transport and local bridge
reqwest = { version = "0.13", default-features = false, features = ["json"], optional = true }
opaque-ke = { version = "4.0.1", features = ["argon2", "std"], optional = true }
uuid = { version = "1.24", features = ["v4", "v5", "serde", "rng-getrandom"] }
axum = { version = "0.8", optional = true }
quick-xml = { version = "0.41", optional = true }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "sync"], optional = true }
# 0.40 links libsqlite3-sys 0.38, which cannot coexist in the workspace
# resolver with SQLx 0.9's libsqlite3-sys <0.38 requirement.
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }
url = "2.5"
qrcode = { version = "0.14", optional = true }
hex = "0.4"
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
